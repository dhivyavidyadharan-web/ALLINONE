[project]
name = "allin-screening"
version = "0.2.0"
description = "All In Capital inbound screening (Neon + Gemini on Vercel)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "google-genai>=3.6",
    "pg8000>=1.31",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.9",
]

[tool.vercel]
entrypoint = "app.main:app"
